<!-- 11. DASHBOARD INDUK (ADMIN VIEW) -->
<div id="dashboardAdmin" class="card hidden">
    <h2>🏠 Dashboard Induk (Pandangan Menyeluruh)</h2>
    <div id="adminGrid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;">
        <!-- Kad kelab akan dijana automatik oleh JavaScript -->
    </div>
</div>

<script>
    // FUNGSI JANA KAD KELAB AUTOMATIK
    function muatDashboardAdmin() {
        let dbKelab = JSON.parse(localStorage.getItem('db_kelab')) || [];
        let container = document.getElementById('adminGrid');
        container.innerHTML = "";

        dbKelab.forEach(kelab => {
            container.innerHTML += `
                <div style="border: 1px solid #e2e8f0; padding: 20px; border-radius: 12px; background: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-top: 5px solid #2563eb;">
                    <h3 style="margin-top:0; color:#1e293b; font-size: 16px;">${kelab.nama}</h3>
                    <p style="font-size:11px; color:#64748b; margin-bottom: 20px;">${kelab.kategori}</p>
                    <div style="display:flex; flex-direction:column; gap:8px;">
                        <button onclick="pilihKelabDanPergi('${kelab.nama}', 'modulRAT')" style="background:#64748b; font-size:12px;">📋 Lihat RAT</button>
                        <button onclick="pilihKelabDanPergi('${kelab.nama}', 'laporanMingguan')" style="background:#10b981; font-size:12px;">📝 Lihat LMK</button>
                        <button onclick="pilihKelabDanPergi('${kelab.nama}', 'laporanTahunan')" style="background:#8b5cf6; font-size:12px;">📈 Laporan Tahunan</button>
                    </div>
                </div>
            `;
        });
    }

    // FUNGSI NAVIGASI PINTAS
    function pilihKelabDanPergi(namaKelab, targetModul) {
        // 1. Set dropdown kelab di modul sasaran (jika ada)
        let select = document.getElementById('pilihKelabCetak');
        if(select) {
            select.value = namaKelab;
            muatDataLMKByBil(); // Refresh data berdasarkan kelab
        }
        
        // 2. Buka modul sasaran
        document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
        document.getElementById(targetModul).classList.remove('hidden');
    }
</script>
