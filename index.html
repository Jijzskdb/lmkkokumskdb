<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Buku Laporan 12 Siri</title>
    <style>
        /* Tetapan Khas untuk Cetakan */
        @media print {
            .page-break { page-break-after: always; }
            .no-print { display: none; }
        }
        
        body { font-family: Arial, sans-serif; background: #eee; padding: 20px; }
        .borang-container { 
            background: white; 
            width: 210mm; /* A4 Width */
            margin: 10px auto; 
            padding: 15mm; 
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        .header { text-align: center; font-weight: bold; margin-bottom: 20px; border-bottom: 2px solid #000; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #000; padding: 8px; font-size: 12px; }
        
        button { position: fixed; top: 20px; right: 20px; padding: 15px 25px; background: #2563eb; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<button class="no-print" onclick="window.print()">🖨️ Cetak Semua 12 Borang</button>

<div id="print-zone">
    <!-- Skrip ini akan generate 12 borang secara automatik -->
    <script>
        // Data ni nanti anda boleh tarik dari Sheet, buat masa ni contoh saja
        const data12Siri = [
            {bil: 1, tarikh: "21-Jan-2026", aktiviti: "Mesyuarat Agung", guru: "Waxry De Valno"},
            {bil: 2, tarikh: "28-Jan-2026", aktiviti: "Ikrar & Persetiaan", guru: "Ahmad Safwan"},
            // ... tambah sampai 12
        ];

        data12Siri.forEach((item, index) => {
            document.write(`
                <div class="borang-container page-break">
                    <div class="header">
                        LAPORAN MINGGUAN KOKURIKULUM (LMK)<br>
                        SK DOGOTON BANGGI KUDAT - BIL ${item.bil}
                    </div>
                    <table>
                        <tr><td>Tarikh: ${item.tarikh}</td><td>Guru Bertugas: ${item.guru}</td></tr>
                        <tr><td colspan="2">Aktiviti: ${item.aktiviti}</td></tr>
                    </table>
                    <div style="margin-top: 50px;">Tandatangan Guru: _________________</div>
                </div>
            `);
        });
    </script>
</div>

</body>
</html>
